desc: >
  Heredera del reino asturiano tras la división de los hijos de Alfonso III
  el Magno en 910, la corona del noroeste cristiano peninsular vivió un
  trayecto complejo de fusiones y separaciones. Desde León (910-1037) pasó a
  unirse temporalmente con Castilla bajo Fernando I (1037), volvió a
  fragmentarse en dos reinos paralelos entre 1157 y 1230 y se reunificó
  definitivamente con Fernando III. Como Corona de Castilla absorbió en 1492
  el reino nazarí de Granada y, desde 1479 mediante unión dinástica con
  Aragón, dio lugar a la monarquía hispánica. Las titulaciones "rey de León"
  y "rey de Castilla" se mantuvieron hasta los Decretos de Nueva Planta de
  Felipe V (1707-1715), que integraron el reino al modelo borbónico
  centralista. La entidad cubre por tanto desde la separación asturiana hasta
  la abolición jurídica de la corona de Castilla como reino diferenciado.
