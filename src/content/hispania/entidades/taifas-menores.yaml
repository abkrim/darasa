desc: >
  Reinos taifas peninsulares secundarios constituidos a partir del colapso del
  califato de Córdoba (1031) y, en algunos casos, ya antes durante la fitna
  (1009-1031). A diferencia de las seis taifas mayores — Sevilla, Toledo,
  Zaragoza, Granada zirí, Badajoz y Valencia, documentadas con sus dinastías
  propias dentro de Al-Ándalus —, estas catorce ciudades-estado tuvieron vida
  política más breve o se mantuvieron como sub-poderes locales bajo dinastías
  menores: eslavones (Almería, Murcia, Denia), bereberes zanatas y miknasa
  (Carmona, Arcos, Morón, Albarracín), hammudíes desplazados desde Córdoba
  (Málaga, Algeciras), o linajes árabes locales (Niebla, Silves). La mayoría
  fueron absorbidas durante la conquista almorávide entre 1090 y 1110; algunas
  reaparecieron como segundas taifas (1144-1170s) entre el colapso almorávide
  y la implantación almohade. Niebla persistió como reino tributario hasta
  1262, cuando Alfonso X la incorporó a la corona de Castilla.
