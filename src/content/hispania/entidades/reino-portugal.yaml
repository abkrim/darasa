desc: >
  Reino atlántico nacido en 1139 cuando Afonso Henriques se titula rey
  tras vencer en Ourique al destacamento almorávide y separar
  definitivamente sus dominios del reino leonés. Su independencia es
  reconocida por León en el tratado de Zamora (1143) y por el papado en
  1179. A lo largo de la Edad Media el reino consolida su frontera
  meridional hasta el Algarve (1249) bajo Afonso III. La casa de Avís,
  surgida tras la crisis sucesoria de 1383-1385, lleva al reino a la
  expansión marítima — Madeira, Azores, Guinea, India, Brasil, Macao —
  hasta la unión dinástica con la monarquía hispánica de Felipe II
  (1580-1640), conocida como Unión Ibérica. La restauración brigantina
  de 1640 abre el período moderno: Brasil como dominio principal,
  invasiones napoleónicas con la corte transferida a Río (1808-1821),
  monarquía constitucional y guerras liberales en el siglo XIX, hasta la
  proclamación de la República en 1910 que pone fin al reino.
