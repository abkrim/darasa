slug: pamplona-navarra
nombre: "Reino de Pamplona-Navarra"
tipo: reino
inicio: 824
fin: 1841
colorVar: "--c-norte"
desc: >
  Reino pirenaico fundado hacia 824 por Íñigo Arista en torno a Pamplona,
  emergiendo del intersticio entre el imperio carolingio al norte, el
  emirato cordobés al sur y los Banu Qasi muladíes en el Ebro. Adoptó el
  título de "rey de Navarra" desde Sancho VI el Sabio (1162). Mantuvo
  independencia o autonomía dinástica durante toda la Edad Media bajo
  sucesivas casas extranjeras (Champaña, Capeto, Évreux, Foix, Albret) hasta
  su anexión castellana en 1515 por Fernando el Católico. Conservó
  instituciones forales propias — Cortes de Navarra, Diputación, Cámara de
  Comptos, fueros — hasta la Ley Paccionada de 1841, que la convirtió en
  provincia foral del Estado liberal español. La entidad cubre los más de
  mil años de existencia del reino, desde Íñigo Arista hasta la
  desaparición jurídica del Reino de Navarra.
fuentes:
  - "Lacarra, J. M. (1972-1973). Historia política del reino de Navarra. Aranzadi, 3 vols."
  - "Martín Duque, Á. J. (1982). Documentación medieval de Leire (siglos IX a XII). Diputación Foral de Navarra."
  - "Floristán Imízcoz, A. (coord.) (2004). Historia de Navarra. Diario de Navarra."
  - "Ramírez Vaquero, E. (2002). Historia de Navarra II: La Baja Edad Media. Gobierno de Navarra."
