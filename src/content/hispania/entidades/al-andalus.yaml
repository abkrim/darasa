desc: >
  Al-Ándalus designa los territorios de la Península Ibérica bajo gobierno
  musulmán entre 711 y 1492. Tras la conquista árabe-bereber y el período
  dependiente de Damasco, Abd al-Rahman I funda el emirato omeya independiente
  de Córdoba en 756. Abd al-Rahman III lo eleva a califato en 929, fragmentado
  en taifas tras la fitna de 1031. Las dinastías norteafricanas almorávide y
  almohade reunifican el territorio entre 1086 y 1232; el reino nazarí de
  Granada — último reducto andalusí desde 1232 — capitula ante los Reyes
  Católicos el 2 de enero de 1492.
