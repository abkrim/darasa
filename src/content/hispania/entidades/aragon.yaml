desc: >
  Reino pirenaico nacido en 1035 cuando Sancho III el Mayor de Pamplona
  legó a su hijo Ramiro un conjunto de condados al sur del Pirineo
  (Aragón, Sobrarbe, Ribagorza). En 1137, mediante el matrimonio dinástico
  de Petronila con Ramón Berenguer IV de Barcelona, se constituyó la
  Corona de Aragón, agregado político que en los siglos siguientes
  incorporaría Valencia, Mallorca, Sicilia, Cerdeña, Nápoles y los
  ducados griegos. La unión dinástica con Castilla por los Reyes Católicos
  (1479) no supuso fusión institucional: Aragón conservó Cortes, fueros y
  Generalitat propios bajo los Habsburgo. Los Decretos de Nueva Planta de
  Felipe V (1707) abolieron las instituciones aragonesas como represalia
  por el apoyo de la corona al archiduque Carlos durante la Guerra de
  Sucesión española, integrándola en el modelo borbónico unificado.
